<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive and accessible calculator built with HTML, CSS, and vanilla JavaScript.">
  <meta name="theme-color" content="#101820">
  <title>Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1 class="visually-hidden">Calculator</h1>

    <section class="calculator" aria-label="Calculator">
      <div class="calculator__display" role="status" aria-live="polite" aria-atomic="true">
        <p class="calculator__previous" id="previous-display" aria-label="Expression"></p>
        <output class="calculator__current" id="current-display" aria-label="Current value">0</output>
      </div>

      <div class="calculator__keypad" aria-label="Calculator keypad">
        <button class="calculator__key calculator__key--utility" type="button" data-action="clear" aria-label="Clear calculator">AC</button>
        <button class="calculator__key calculator__key--utility" type="button" data-action="delete" aria-label="Delete last digit">DEL</button>
        <button class="calculator__key calculator__key--operator" type="button" data-operator="/" aria-label="Divide">÷</button>
        <button class="calculator__key calculator__key--operator" type="button" data-operator="*" aria-label="Multiply">×</button>

        <button class="calculator__key" type="button" data-number="7">7</button>
        <button class="calculator__key" type="button" data-number="8">8</button>
        <button class="calculator__key" type="button" data-number="9">9</button>
        <button class="calculator__key calculator__key--operator" type="button" data-operator="-" aria-label="Subtract">−</button>

        <button class="calculator__key" type="button" data-number="4">4</button>
        <button class="calculator__key" type="button" data-number="5">5</button>
        <button class="calculator__key" type="button" data-number="6">6</button>
        <button class="calculator__key calculator__key--operator" type="button" data-operator="+" aria-label="Add">+</button>

        <button class="calculator__key" type="button" data-number="1">1</button>
        <button class="calculator__key" type="button" data-number="2">2</button>
        <button class="calculator__key" type="button" data-number="3">3</button>
        <button class="calculator__key calculator__key--equals" type="button" data-action="calculate" aria-label="Calculate result">=</button>

        <button class="calculator__key calculator__key--zero" type="button" data-number="0">0</button>
        <button class="calculator__key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
      </div>
    </section>
  </main>
  <script src="js/script.js" defer></script>
</body>
</html>
